name: Deploy to WP Engine (dev)

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy plugin to texascount1dev
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: texascount1dev
          SRC_PATH: "."
          REMOTE_PATH: "wp-content/plugins/zp-vendor-portal/"
          FLAGS: -azvr --inplace --delete --exclude-from=.deployignore
          CACHE_CLEAR: TRUE
